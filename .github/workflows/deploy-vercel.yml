name: Deploy - Vercel (Pearl Connexions)

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/deploy-vercel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_nvrETovmDRtUay05tg8OkZb0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: pc-website
            project_id: prj_bMvrE0ahVkLnfUTxZNkDA5TaM31I
          - project: pc-workbook
            project_id: prj_2KFiiXLZoTzjoMGvBf4lsP0XKdBI
          - project: pc-qadashboard
            project_id: prj_GXB6UVqvb9tK38GWDJvKTVfqX0HY
    env:
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ENZOTHOME1 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar pnpm para el panel de calidad
        if: matrix.project == 'pc-qadashboard'
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - name: Instalar Vercel CLI
        run: npm install --global vercel@50.1.3
      - name: Traer configuración de producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construir
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Quitar metadatos del repositorio
        run: rm -rf .git
      - name: Desplegar
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"


